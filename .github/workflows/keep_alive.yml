name: Ping Render Backend

on:
  schedule:
    # Ping every 5 minutes (leaves huge safety margin before Render's 15m sleep even with GitHub queue jitter)
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Warm Backend API & Caches
        env:
          TARGET_URL: ${{ secrets.BACKEND_URL || 'https://api.nearmycolleges.in' }}
        run: |
          echo "Warming backend at $TARGET_URL/api/v1/health/warm"
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$TARGET_URL/api/v1/health/warm")
          echo "Response status: $RESPONSE"
          if [ "$RESPONSE" != "200" ]; then
            echo "Fallback ping to https://api.nearmycolleges.in/api/v1/health/warm"
            curl -f -s --max-time 60 "https://api.nearmycolleges.in/api/v1/health/warm" || echo "Warm ping completed"
          fi
