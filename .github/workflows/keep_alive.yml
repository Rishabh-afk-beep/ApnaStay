name: Ping Render Backend

on:
  schedule:
    - cron: "*/10 * * * *" # Runs every 10 minutes
  workflow_dispatch: # Allows manual triggering

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend API
        env:
          BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL || 'https://pgliving-backend.onrender.com' }}
        run: |
          echo "Pinging backend at $BACKEND_URL/api/v1/health/stats"
          curl -f -s "$BACKEND_URL/api/v1/health/stats" || echo "Ping failed or URL is incorrect. Make sure you set RENDER_BACKEND_URL in GitHub Secrets."
