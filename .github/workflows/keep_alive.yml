name: Ping Render Backend

on:
  schedule:
    - cron: "*/10 * * * *" # Runs every 10 minutes
  workflow_dispatch: # Allows manual triggering

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend API
        run: |
          echo "Pinging backend at https://api.nearmycolleges.in/api/v1/health"
          curl -f -s --max-time 30 "https://api.nearmycolleges.in/api/v1/health" || echo "Ping failed"
          echo ""
          echo "Pinging Render direct URL as backup"
          curl -f -s --max-time 30 "https://pgliving-backend.onrender.com/api/v1/health" || echo "Render ping failed"
