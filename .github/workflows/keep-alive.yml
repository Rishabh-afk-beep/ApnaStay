name: Keep Backend Alive

# Pings the Render backend every 14 minutes to prevent cold starts.
# Render's free tier spins down after 15 min of inactivity; this keeps it warm.

on:
  schedule:
    # Every 14 minutes
    - cron: "*/14 * * * *"
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          BACKEND_URL="${{ secrets.BACKEND_URL }}"
          if [ -z "$BACKEND_URL" ]; then
            echo "⚠️ BACKEND_URL secret is not set. Please add it in GitHub repo Settings > Secrets."
            exit 1
          fi
          echo "🔔 Pinging $BACKEND_URL/api/v1/health ..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 "$BACKEND_URL/api/v1/health")
          echo "📡 Response code: $RESPONSE"
          if [ "$RESPONSE" = "200" ]; then
            echo "✅ Backend is alive!"
          else
            echo "⚠️ Backend returned $RESPONSE (may still be waking up — that's OK)"
          fi
