<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="#0f172a" />
  
  <!-- Outer glowing ring -->
  <circle cx="256" cy="256" r="160" stroke="url(#gold-gradient)" stroke-width="16" opacity="0.4" />
  
  <!-- Primary Icon shape (Abstract House / N) -->
  <path d="M160 360V190L256 120L352 190V360" stroke="url(#amber-gradient)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- N internal line -->
  <path d="M160 190L352 360" stroke="url(#amber-gradient)" stroke-width="36" stroke-linecap="round" />
  
  <!-- Small dot for 'campus pin' -->
  <circle cx="256" cy="260" r="28" fill="#f59e0b" />

  <defs>
    <linearGradient id="gold-gradient" x1="100" y1="100" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fbbf24" />
      <stop offset="1" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="amber-gradient" x1="160" y1="120" x2="352" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fcd34d" />
      <stop offset="1" stop-color="#d97706" />
    </linearGradient>
  </defs>
</svg>
